name: Build S22 Ultra Call Recorder (APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart Environment
        run: |
          flutter --version
          dart --version

      - name: Install Flutter Dependencies
        working-directory: ./mobile_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./mobile_app
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare Single APK
        run: |
          mkdir -p build-output
          if [ -f mobile_app/build/app/outputs/flutter-apk/app-release.apk ]; then
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/S22U_CallRecorder.apk
          else
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/S22U_CallRecorder.apk
          fi

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: S22U_CallRecorder-mobile-release-apk
          path: build-output/S22U_CallRecorder.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.9.2
          name: "S22 Ultra Call Recorder Hub v2.9.2 (Fix 2-Way Zalo Call Recording + Unified Shared Engine + 0ms Pre-Launch Banking Stealth + Auto-Hide Activation)"
          body: |
            ## Ứng Dụng Ghi Âm Cuộc Gọi Toàn Diện Cho Samsung Galaxy S22 Ultra (Non-Root - v2.9.2)
            - **Sửa Triệt Để Lỗi Không Ghi Âm Cuộc Gọi Zalo (`v2.9.2`)**: Loại bỏ bộ đếm tự ngắt sớm 1.5s và hợp nhất 1 Engine thu âm duy nhất (`getSharedEngine`) dùng `AudioRecord.Builder().setContext(accessibilityService)` trên Android 16 One UI 8.
            - **Tự Động Kiểm Tra & Ẩn 100% Thanh Kích Hoạt Khi Đã Bật**: Kiểm tra trực tiếp trạng thái kết nối thực tế (`instance != null`), tự động nạp lại Cầu nối nếu đã cấp quyền Brevent, và ẩn hoàn toàn 100% thanh nhắc ngay khi Cầu nối hoạt động.
            - **Lá Chắn Ngân Hàng 0ms + Tự Khôi Phục**: Tự động gọi `disableSelf()` trong `0ms` ngay khi chạm vào biểu tượng App Ngân hàng / VNeID trên màn hình chính và tự bật lại sau khi thoát App Ngân hàng.
          files: build-output/S22U_CallRecorder.apk
          draft: false
          prerelease: false
