name: Build S22 Ultra Call Recorder (APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart Environment
        run: |
          flutter --version
          dart --version

      - name: Install Flutter Dependencies
        working-directory: ./mobile_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./mobile_app
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare Single APK
        run: |
          mkdir -p build-output
          if [ -f mobile_app/build/app/outputs/flutter-apk/app-release.apk ]; then
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/S22U_CallRecorder.apk
          else
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/S22U_CallRecorder.apk
          fi

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: S22U_CallRecorder-mobile-release-apk
          path: build-output/S22U_CallRecorder.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v3.0.1
          name: "S22 Ultra Call Recorder Hub v3.0.1 (True Master App ON/OFF Power Lock + 100% Continuous Voice Capture)"
          body: |
            ## Ứng Dụng Ghi Âm Cuộc Gọi Toàn Diện Cho Samsung Galaxy S22 Ultra (Non-Root - v3.0.1)
            - **Công Tắc Nguồn Tổng `BẬT / TẮT ỨNG DỤNG` (True Master Power Lock — Khi Đã Tắt Tuyệt Đối Không Tự Bật Lại)**:
              + Khi bấm **`TẮT ỨNG DỤNG`** (hoặc **`TẮT & ĐÓNG APP`**), ứng dụng lập tức ngắt 100% dịch vụ chạy ngầm (`CallMonitorForegroundService`), ngắt Cầu nối Trợ năng (`OTTCallAccessibilityService`), ngắt bộ lắng nghe phần cứng (`OTTCallNotificationListener`), khóa `CallBootBroadcastReceiver` ở cấp `PackageManager` và lưu cờ khóa cứng `masterAppEnabled = false` đồng bộ (`.commit()`).
              + **Bất biến Không Tự Bật Lại**: Khi đang ở trạng thái ĐÃ TẮT, ứng dụng tuyệt đối **KHÔNG BAO GIỜ tự bật lại** (dù mở lại giao diện App để nghe file cũ, có cuộc gọi SIM/Zalo đến, chuyển tab hay khởi động lại điện thoại) cho đến khi người dùng chủ động bấm vào nút **`BẬT ỨNG DỤNG`**.
            - **Khắc Phục Triệt Để Lỗi Mất Tiếng ("Đa Số Không Thu Được Tiếng")**:
              + Loại bỏ vòng lặp tự hủy `AudioRecord` sau `128ms` và thay thế cổng `Pitch Gate` bằng Bộ Khuếch Đại Giọng Nói Luôn Mở (`Always-Open 512-Point FFT Bandpass 200Hz–3600Hz + Capped Wiener`).
          files: build-output/S22U_CallRecorder.apk
          draft: false
          prerelease: false
