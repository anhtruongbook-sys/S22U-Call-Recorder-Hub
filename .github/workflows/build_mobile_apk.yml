name: Build S22 Ultra Call Recorder (APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart Environment
        run: |
          flutter --version
          dart --version

      - name: Install Flutter Dependencies
        working-directory: ./mobile_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./mobile_app
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare Single APK
        run: |
          mkdir -p build-output
          if [ -f mobile_app/build/app/outputs/flutter-apk/app-release.apk ]; then
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/S22U_CallRecorder.apk
          else
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/S22U_CallRecorder.apk
          fi

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: S22U_CallRecorder-mobile-release-apk
          path: build-output/S22U_CallRecorder.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.9.3
          name: "S22 Ultra Call Recorder Hub v2.9.3 (Studio Noise Suppression -13dB + 2-Stage 260Hz-3400Hz Voice Bandpass + Keep Hardware AEC)"
          body: |
            ## Ứng Dụng Ghi Âm Cuộc Gọi Toàn Diện Cho Samsung Galaxy S22 Ultra (Non-Root - v2.9.3)
            - **Xử Lý Triệt Để Tiếng Ồn / Sôi Nền (`v2.9.3`)**:
              + Giữ nguyên bộ khử tiếng vang phần cứng (`AcousticEchoCanceler`) và bật `NoiseSuppressor` của chip Snapdragon.
              + Lọc thông dải giọng nói 2 tầng (`260Hz – 3400Hz`) cắt sạch tiếng ù trầm (`< 260Hz`) và tiếng xè cao tần (`> 3.4kHz`).
              + Cổng nén tạp âm nền thích ứng (`Downward Expander 0.22x` / `-13 dB` khi không có tiếng nói) và hạ mức khuếch đại từ `8.4x` + `6.0x` xuống mức cân bằng tự nhiên `1.6x` (`-7.1 dBFS`).
          files: build-output/S22U_CallRecorder.apk
          draft: false
          prerelease: false
