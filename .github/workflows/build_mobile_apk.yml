name: Build S22 Ultra Call Recorder (APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart Environment
        run: |
          flutter --version
          dart --version

      - name: Install Flutter Dependencies
        working-directory: ./mobile_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./mobile_app
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare Single APK
        run: |
          mkdir -p build-output
          if [ -f mobile_app/build/app/outputs/flutter-apk/app-release.apk ]; then
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/S22U_CallRecorder.apk
          else
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/S22U_CallRecorder.apk
          fi

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: S22U_CallRecorder-mobile-release-apk
          path: build-output/S22U_CallRecorder.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.9.1
          name: "S22 Ultra Call Recorder Hub v2.9.1 (Clean Recordings UI + Auto-Hide Activation When Granted + Banking-Safe Ephemeral Bridge)"
          body: |
            ## Ứng Dụng Ghi Âm Cuộc Gọi Toàn Diện Cho Samsung Galaxy S22 Ultra (Non-Root - v2.9.0)
            - **Kích Hoạt 100% Trực Tiếp Trên Điện Thoại (Không Cần Máy Tính)**: Tích hợp 2 chế độ kích hoạt ngay trên điện thoại (1-Tap Bật trước khi gọi tự tắt 0ms khi cúp máy/mở Ngân hàng, hoặc Gỡ lỗi không dây ngay trên ĐT qua Brevent 1 lần duy nhất).
            - **Tương Thích 100% Mọi App Ngân Hàng & VNeID**: Mặc định TẮT Trợ năng 100% ngoài cuộc gọi; tự động gọi `disableSelf()` trong `0ms` ngay khi cúp máy hoặc mở bất kỳ App Ngân hàng nào.
            - **Thu âm 2 chiều rõ nét chuẩn `.m4a` (AAC-LC 128kbps)**: Mở khóa luồng `VOICE_RECOGNITION` trong cuộc gọi Zalo/OTT trên Android 16 One UI 8.
          files: build-output/S22U_CallRecorder.apk
          draft: false
          prerelease: false
