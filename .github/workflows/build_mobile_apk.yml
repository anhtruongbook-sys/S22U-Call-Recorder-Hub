name: Build S22 Ultra Call Recorder (APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart Environment
        run: |
          flutter --version
          dart --version

      - name: Install Flutter Dependencies
        working-directory: ./mobile_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./mobile_app
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare Single APK
        run: |
          mkdir -p build-output
          if [ -f mobile_app/build/app/outputs/flutter-apk/app-release.apk ]; then
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/S22U_CallRecorder.apk
          else
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/S22U_CallRecorder.apk
          fi

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: S22U_CallRecorder-mobile-release-apk
          path: build-output/S22U_CallRecorder.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v3.0.2
          name: "S22 Ultra Call Recorder Hub v3.0.2 (Zalo 48kHz WebRTC Hardware Audio Fix + Persistent Accessibility Bridge)"
          body: |
            ## Ứng Dụng Ghi Âm Cuộc Gọi Toàn Diện Cho Samsung Galaxy S22 Ultra (Non-Root - v3.0.2)
            - **Khắc Phục Triệt Để Lỗi Không Thu Được Âm Thanh Cuộc Gọi Zalo**:
              + **Bảo Toàn Quyền Cầu Nối `S22U Call Bridge` Khi Bật/Tắt Ứng Dụng**: Sửa lỗi ở bản `v3.0.1` khi bấm `TẮT ỨNG DỤNG` đã gọi `disableSelf()` làm hệ điều hành Android thu hồi vĩnh viễn quyền `S22U Call Audio Bridge` (khiến khi bấm `BẬT ỨNG DỤNG` trở lại thì cầu nối bị chết ngầm và Android 16 khóa mic trong cuộc gọi Zalo). Từ `v3.0.2`, khi bấm `TẮT ỨNG DỤNG`, ứng dụng chỉ gỡ bỏ `1x1` Audio Anchor, hủy toàn bộ Listener và dừng dịch vụ chạy ngầm (0% Pin, không bao giờ tự bật lại), nhưng **giữ nguyên quyền `S22U Call Audio Bridge`** để khi bấm `BẬT ỨNG DỤNG` là thu âm Zalo 2 chiều ngay lập tức.
              + **Khôi Phục Cấu Hình Phần Cứng `48000 Hz` + `AcousticEchoCanceler(false)` + `AutomaticGainControl(true)`**: Đồng bộ tần số lấy mẫu phần cứng `48000 Hz` khớp với bộ trộn VoIP WebRTC của Zalo trên S22 Ultra và tắt bộ khử vọng phần cứng (`AEC = false`) trên chip Qualcomm ADSP để ADSP không triệt tiêu tiếng người đầu dây bên kia phát ra từ loa thoại.
              + **Tự Động Rebind Luồng `AudioRecord` Khi Zalo Kết Nối Đàm Thoại WebRTC**: Khi cuộc gọi Zalo chuyển từ Đổ chuông sang Đàm thoại (hoặc khi WebRTC của Zalo chiếm quyền mic làm `AudioRecord` chỉ trả về nhiễu lượng tử LSB `±1..±5`), động cơ tự động đóng luồng cũ và Rebind lại luồng `VOICE_RECOGNITION` trên `AccessibilityContext` sau `500ms`.
              + **Bắt Sự Kiện Cuộc Gọi Zalo Trực Tiếp Trong `OTTCallAccessibilityService`**: Đăng ký `OnModeChangedListener` và `AudioRecordingCallback` ngay trong tiến trình Trợ năng của hệ thống (không bao giờ bị Samsung Freecess đóng băng ngầm).
          files: build-output/S22U_CallRecorder.apk
          draft: false
          prerelease: false
