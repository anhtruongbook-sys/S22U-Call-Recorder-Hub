name: Build S22 Ultra Call Recorder (APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart Environment
        run: |
          flutter --version
          dart --version

      - name: Install Flutter Dependencies
        working-directory: ./mobile_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./mobile_app
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare Single APK
        run: |
          mkdir -p build-output
          if [ -f mobile_app/build/app/outputs/flutter-apk/app-release.apk ]; then
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/S22U_CallRecorder.apk
          else
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/S22U_CallRecorder.apk
          fi

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: S22U_CallRecorder-mobile-release-apk
          path: build-output/S22U_CallRecorder.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v3.0.3
          name: "S22 Ultra Call Recorder Hub v3.0.3 (0ms Auto-Disable Accessibility on App OFF & Banking Apps + Zalo 48kHz Audio)"
          body: |
            ## Ứng Dụng Ghi Âm Cuộc Gọi Toàn Diện Cho Samsung Galaxy S22 Ultra (Non-Root - v3.0.3)
            - **Tự Động Tắt Trợ Năng (`disableSelf()`) Tức Thì `0ms` Khi Bấm `TẮT ỨNG DỤNG` Hoặc Khi Vào App Ngân Hàng**:
              + **Khi Bấm `TẮT ỨNG DỤNG` / `TẮT & ĐÓNG APP`**: Lập tức gọi `disableSelf()` để tắt 100% dịch vụ Trợ năng `S22U Call Audio Bridge` trong Cài đặt Android (đảm bảo không còn bất kỳ dịch vụ Trợ năng nào chạy ngầm). Khi bấm `BẬT ỨNG DỤNG` trở lại, ứng dụng tự động bật lại (hoặc tự động mở ngay trang Cài đặt Trợ năng nếu máy chưa cấp `WRITE_SECURE_SETTINGS`).
              + **Tự Động Tắt Trợ Năng `0ms` Khi Vào Mọi App Ngân Hàng / Ví Điện Tử / VNeID (`notificationTimeout="0"`)**:
                * **Tầng 0 & Tầng 1**: Loại bỏ độ trễ `80ms` của Accessibility (`notificationTimeout="0"`), kiểm tra `event.packageName` và `rootInActiveWindow.packageName` ở **mọi loại sự kiện `AccessibilityEvent`** đối với hơn 65 ngân hàng/ví điện tử/VNeID + tự động phát hiện mọi ứng dụng thuộc nhóm Tài chính (`ApplicationInfo.CATEGORY_FINANCE`).
                * **Tầng 2 (Bắt Chạm Icon Ngân Hàng Trên Màn Hình Chính Trước Khi App Ngân Hàng Khởi Chạy)**: Sửa lỗi ghép chuỗi `event.text` + `event.contentDescription` trên One UI Home Launcher và tự động quét tên hiển thị thực tế của mọi App Ngân hàng cài trên máy, giúp gọi `disableSelf()` ngay khoảnh khắc ngón tay chạm vào icon Ngân hàng.
            - **Giữ Nguyên Động Cơ Thu Âm Zalo/OTT 48kHz Chuẩn Phần Cứng S22 Ultra**:
              + Giữ nguyên luồng phần cứng `48000 Hz`, `AcousticEchoCanceler(false)`, `AutomaticGainControl(true)` và tự động Rebind khi Zalo kết nối WebRTC.
          files: build-output/S22U_CallRecorder.apk
          draft: false
          prerelease: false
