name: Build S22 Ultra Call Recorder (APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart Environment
        run: |
          flutter --version
          dart --version

      - name: Install Flutter Dependencies
        working-directory: ./mobile_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./mobile_app
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare Single APK
        run: |
          mkdir -p build-output
          if [ -f mobile_app/build/app/outputs/flutter-apk/app-release.apk ]; then
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/S22U_CallRecorder.apk
          else
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/S22U_CallRecorder.apk
          fi

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: S22U_CallRecorder-mobile-release-apk
          path: build-output/S22U_CallRecorder.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.6.0
          name: "S22 Ultra Call Recorder Hub v2.6.0 (Zero-Accessibility 100% Banking Compatible + v2.0.0 0ms Direct Voice Capture + Answer Gate + NFC Vietnamese)"
          body: |
            ## Ứng Dụng Ghi Âm Cuộc Gọi Toàn Diện Cho Samsung Galaxy S22 Ultra (Non-Root)
            - **100% Không dùng Trợ năng (Zero AccessibilityService)**: Xóa bỏ vĩnh viễn thành phần Trợ năng khỏi APK, mở mọi ứng dụng Ngân hàng (VCB, BIDV, VietinBank, Techcombank, MB Bank, VNeID) bình thường 100%.
            - **Thu âm 2 chiều rõ nét (0ms Direct Hardware Capture + Answer Pre-Roll Gate)**: Khởi tạo kênh `VOICE_RECOGNITION` ngay tức khắc ở `0ms` trước khi Zalo khóa Mic (như bản `v2.0.0`), lọc bỏ hoàn toàn đoạn chờ đổ chuông chưa nhấc máy và khuếch đại tiếng nói sạch không sôi nhiễu.
            - **Tên file Tiếng Việt Chuẩn Unicode NFC**: Giữ nguyên đầy đủ dấu Tiếng Việt (`Zalo_Trương_Thành_Long_...wav`) và tự động sửa lại các file bị lỗi dấu trước đó.
            - **Tải tệp APK**: Tải file `S22U_CallRecorder.apk` bên dưới về điện thoại Samsung S22 Ultra và nhấn Cài đặt.
          files: build-output/S22U_CallRecorder.apk
          draft: false
          prerelease: false
