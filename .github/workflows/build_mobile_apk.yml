name: Build S22 Ultra Call Recorder (APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart Environment
        run: |
          flutter --version
          dart --version

      - name: Install Flutter Dependencies
        working-directory: ./mobile_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./mobile_app
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare Single APK
        run: |
          mkdir -p build-output
          if [ -f mobile_app/build/app/outputs/flutter-apk/app-release.apk ]; then
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/S22U_CallRecorder.apk
          else
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/S22U_CallRecorder.apk
          fi

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: S22U_CallRecorder-mobile-release-apk
          path: build-output/S22U_CallRecorder.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.9.5
          name: "S22 Ultra Call Recorder Hub v2.9.5 (Fix Silent Conversation after Answer + Continuous Mono VOICE_RECOGNITION + Adaptive Noise-Floor Voice Boost)"
          body: |
            ## Ứng Dụng Ghi Âm Cuộc Gọi Toàn Diện Cho Samsung Galaxy S22 Ultra (Non-Root - v2.9.5)
            - **Khắc Phục Triệt Để Lỗi Mất Tiếng Khi Nhấc Máy (`6.016s -> 0`)**: Giữ nguyên luồng `VOICE_RECOGNITION` (Mono) liên tục xuyên suốt từ lúc bắt đầu đến khi kết thúc cuộc gọi, loại bỏ `CHANNEL_IN_STEREO` và `AudioSource.MIC` (nguyên nhân khiến AudioPolicyService tắt tiếng về `0` khi Zalo vào chế độ đàm thoại), đồng thời tắt `AcousticEchoCanceler` cục bộ trên `sessionId` để không bị xóa tiếng loa thoại của người bên kia.
            - **Gắn Neo `1x1 TYPE_ACCESSIBILITY_OVERLAY` & Khuếch Đại Giọng Nói Thích Nghi Nền Phòng**: Đảm bảo `isA11yOnTop() == true` 100% trên Android 16 / One UI 8; tự động giữ nguyên nền phòng yên tĩnh (`< 195`) không khuếch đại tiếng ồn và chỉ nâng giọng nói đàm thoại 2 chiều rõ nét chuẩn `.m4a` (`192kbps`).
          files: build-output/S22U_CallRecorder.apk
          draft: false
          prerelease: false
