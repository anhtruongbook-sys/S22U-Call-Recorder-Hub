name: Build S22 Ultra Call Recorder (APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart Environment
        run: |
          flutter --version
          dart --version

      - name: Install Flutter Dependencies
        working-directory: ./mobile_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./mobile_app
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare Single APK
        run: |
          mkdir -p build-output
          if [ -f mobile_app/build/app/outputs/flutter-apk/app-release.apk ]; then
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/S22U_CallRecorder.apk
          else
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/S22U_CallRecorder.apk
          fi

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: S22U_CallRecorder-mobile-release-apk
          path: build-output/S22U_CallRecorder.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.9.9
          name: "S22 Ultra Call Recorder Hub v2.9.9 (Loud Studio Voice + Zero-Noise 512-Point FFT Amplitude Wiener + Linear Confirmed-Voice Normalizer)"
          body: |
            ## Ứng Dụng Ghi Âm Cuộc Gọi Toàn Diện Cho Samsung Galaxy S22 Ultra (Non-Root - v2.9.9)
            - **Nâng Cấp Âm Lượng Giọng Nói Chuẩn Studio (`Peak ~ 26.800`, `-1.7 dBFS`) Mà Vẫn Giữ Nền Tĩnh Lặng Tuyệt Đối (`Silence RMS < 2.0`, `SNR > 80 dB`)**:
              + Chuyển hàm truyền đạt Wiener từ tỷ số công suất $P_{\text{clean}} / P$ sang **Bộ Lọc Biên Độ Wiener Chuẩn ($\sqrt{P_{\text{clean}} / P}$)**, khôi phục trọn vẹn năng lượng hài âm giọng nói tự nhiên.
              + Khi cổng chu kỳ dây thanh quản người (`Wiener-Khinchin Pitch Gate`, `85 Hz – 365 Hz`) xác nhận có $\ge 2$ khung sóng hài giọng nói liên tiếp (`pitchCorr >= 0.45`), bộ khuếch đại giọng nói mở tức thời lên mức mục tiêu `6500 / cleanRms` (tối đa `8.5x`) kèm thời gian ngân đuôi âm tiết `8 khung (128ms)`, trong khi tạp âm nền không tuần hoàn vẫn bị khóa chặt ở `-32 dB` (`0.025x`).
              + Bổ sung **Bộ Chuẩn Hóa Tuyến Tính Hằng Số Có Xác Thực Giọng Nói (`normalizeConfirmedVoiceWavLinear`)**: chỉ kích hoạt khi cuộc gọi có tối thiểu $\ge 12$ khung giọng người đã xác thực, nhân một hệ số tuyến tính hằng số duy nhất đưa đỉnh giọng nói lên `26.800 / 32.767` (`-1.7 dBFS`) mà không làm tăng tiếng ồn nền (vì nền đã ở mức `< 1.0`, nhân tuyến tính vẫn giữ nền `< 4.0` / `-78 dBFS`).
              + Tích hợp `LoudnessEnhancer (+4.0 dB)` cho trình phát nội bộ trong ứng dụng và nâng mức âm lượng loa thoại tự động lên `85%`.
            - **Giữ Nguyên Lá Chắn Tàng Hình Ngân Hàng `0ms` (`v2.9.7`)**: Tự động ngắt `OTTCallAccessibilityService` ngay khi mở App Ngân hàng / VNeID.
          files: build-output/S22U_CallRecorder.apk
          draft: false
          prerelease: false
