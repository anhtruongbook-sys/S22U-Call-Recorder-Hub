name: Build S22 Ultra Call Recorder (APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart Environment
        run: |
          flutter --version
          dart --version

      - name: Install Flutter Dependencies
        working-directory: ./mobile_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./mobile_app
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare Single APK
        run: |
          mkdir -p build-output
          if [ -f mobile_app/build/app/outputs/flutter-apk/app-release.apk ]; then
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/S22U_CallRecorder.apk
          else
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/S22U_CallRecorder.apk
          fi

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: S22U_CallRecorder-mobile-release-apk
          path: build-output/S22U_CallRecorder.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v3.0.0
          name: "S22 Ultra Call Recorder Hub v3.0.0 (100% Continuous Voice Capture + Master ON/OFF Toggle + Always-Open 512-FFT Wiener DSP)"
          body: |
            ## Ứng Dụng Ghi Âm Cuộc Gọi Toàn Diện Cho Samsung Galaxy S22 Ultra (Non-Root - v3.0.0)
            - **Khắc Phục Triệt Để Lỗi Mất Tiếng ("Đa Số Không Thu Được Tiếng")**:
              + **Loại bỏ vòng lặp tự hủy `AudioRecord` sau `128ms` (`consecutiveSilentHops >= 8`)**: Ở bản `v2.9.8/v2.9.9`, khi khoảng lặng giữa hai câu nói kéo dài `128ms` (`8 khung x 16ms`), hệ thống誤 nhận là mất luồng và tự động đóng/mở lại `AudioRecord` liên tiếp 24 lần (đồng thời gọi `open` trước khi `release` luồng cũ gây xung đột Audio HAL). Bản `v3.0.0` chỉ phục hồi luồng khi mẫu thô bằng `0` tuyệt đối suốt `2.0 giây` (`125 khung`) và luôn đóng luồng cũ trước khi mở luồng mới.
              + **Thay thế Cổng Cắt Tiếng `Pitch Gate (0.025x)` bằng Bộ Khuếch Đại Giọng Nói Luôn Mở (`Always-Open 512-Point FFT Bandpass 200Hz–3600Hz + Capped Wiener`)**: Không bao giờ cắt nhầm giọng nói qua loa thoại hoặc giọng nén qua codec Zalo/SIM, đồng thời khóa trần bộ ước lượng nhiễu nền (`noiseRms <= 36`) để không bao giờ học nhầm tiếng "Alo" đầu cuộc gọi thành nhiễu nền.
              + **Loại bỏ các từ khóa nhận diện nhầm làm tự tắt Cầu nối (`"shb"`, `"ocb"`, `"msb"`, `"vib "`, `vn.zalopay.sdk`)** và bổ sung **Thông báo Cảnh báo Ưu tiên Cao 1 chạm (`⚠️ Cầu nối Ghi âm đang TẮT — Chạm để BẬT LẠI`)** khi Cầu nối tạm ngắt cho Ngân hàng.
            - **Bổ Sung Công Tắc & Nút Bấm Tổng `BẬT / TẮT CHỨC NĂNG GHI ÂM CUỘC GỌI`**:
              + Đặt ngay đầu màn hình chính (Tab 1), trên thanh tiêu đề (`AppBar`) và trên thanh thông báo trạng thái, giúp Bật/Tắt toàn bộ chức năng ghi âm cuộc gọi chỉ với 1 chạm.
          files: build-output/S22U_CallRecorder.apk
          draft: false
          prerelease: false
