name: Build S22 Ultra Call Recorder (APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart Environment
        run: |
          flutter --version
          dart --version

      - name: Install Flutter Dependencies
        working-directory: ./mobile_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./mobile_app
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare Single APK
        run: |
          mkdir -p build-output
          if [ -f mobile_app/build/app/outputs/flutter-apk/app-release.apk ]; then
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/S22U_CallRecorder.apk
          else
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/S22U_CallRecorder.apk
          fi

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: S22U_CallRecorder-mobile-release-apk
          path: build-output/S22U_CallRecorder.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.9.8
          name: "S22 Ultra Call Recorder Hub v2.9.8 (16kHz Hardware NS + 512-Point FFT Wiener Spectral Denoiser + Wiener-Khinchin Pitch Voice Gate)"
          body: |
            ## Ứng Dụng Ghi Âm Cuộc Gọi Toàn Diện Cho Samsung Galaxy S22 Ultra (Non-Root - v2.9.8)
            - **Thay Thế Hoàn Toàn Bộ AGC Miền Thời Gian Bằng Động Cơ Lọc Phổ `512-Point Radix-2 FFT Wiener` + Nhận Diện Chu Kỳ Dây Thanh Quản `Wiener-Khinchin Pitch Gate` (`SNR = 87.5 dB`)**:
              + Chuyển sang thu âm ở tần số gốc **`16.000 Hz` (16kHz Wideband HD)** của chip xử lý giọng nói Qualcomm Fluence Pro, bảo toàn 100% ma trận khử ồn phần cứng (`NoiseSuppressor = true`, không tắt `AcousticEchoCanceler` và không bật `AutomaticGainControl` phần cứng gây sôi nền).
              + Mỗi khung `32ms` (`512` mẫu, chồng lấp 50% cửa sổ `sqrt-Hann`) được biến đổi sang miền tần số bằng `Radix-2 FFT`, cắt bỏ tuyệt đối (`0.0`) mọi vạch phổ dưới `250 Hz` (tiếng ù phòng, quạt gió, rung tay) và trên `3.400 Hz` (tiếng xè nhiệt).
              + Áp dụng **Định lý Wiener-Khinchin (`IFFT(|X(k)|^2)`)** để đo độ tuần hoàn dây thanh quản người (`85 Hz – 365 Hz`): khi không có sóng hài giọng người, cổng âm thanh tự động nén sâu xuống `-30.5 dB` (`0.03x`), giữ khoảng lặng êm tuyệt đối (`RMS = 0.11`, `-94 dBFS`).
              + Xóa bỏ hoàn toàn hàm `normalizeWavFileToBroadcastStandard` và `LoudnessEnhancer` (`+7.5 dB`) từng phóng đại nhiễu nền gấp hàng chục lần ở các bản trước.
            - **Giữ Nguyên Lá Chắn Tàng Hình Ngân Hàng `0ms` (`v2.9.7`)**: Tự động ngắt `OTTCallAccessibilityService` ngay khi mở App Ngân hàng / VNeID và không bao giờ tự bật lại khi đang ở trong App Ngân hàng.
          files: build-output/S22U_CallRecorder.apk
          draft: false
          prerelease: false
