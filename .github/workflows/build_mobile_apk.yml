name: Build S22 Ultra Call Recorder (APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart Environment
        run: |
          flutter --version
          dart --version

      - name: Install Flutter Dependencies
        working-directory: ./mobile_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./mobile_app
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare Single APK
        run: |
          mkdir -p build-output
          if [ -f mobile_app/build/app/outputs/flutter-apk/app-release.apk ]; then
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/S22U_CallRecorder.apk
          else
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/S22U_CallRecorder.apk
          fi

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: S22U_CallRecorder-mobile-release-apk
          path: build-output/S22U_CallRecorder.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.9.4
          name: "S22 Ultra Call Recorder Hub v2.9.4 (Dual-Mic Stereo Top-Earpiece Pickup + Pure Linear Hardware NS/AGC + 192kbps .m4a)"
          body: |
            ## Ứng Dụng Ghi Âm Cuộc Gọi Toàn Diện Cho Samsung Galaxy S22 Ultra (Non-Root - v2.9.4)
            - **Thu Âm Kép 2 Mic (`Dual-Mic Stereo Top-Earpiece Pickup`)**: Kích hoạt đồng thời cả **Mic Đỉnh máy (cách Loa thoại Earpiece chỉ 8mm)** và **Mic Đáy máy** trên S22 Ultra để bắt trực tiếp âm thanh loa thoại mà không cần đẩy Gain phần mềm.
            - **Âm Thanh Tuyến Tính Nguyên Bản (`Pure Linear Hardware NS/AGC`)**: Sử dụng trực tiếp `NoiseSuppressor` + `AutomaticGainControl` phần cứng của chip Qualcomm Snapdragon, loại bỏ 100% hiện tượng sôi nền/thở nền do bơm Gain biến thiên, mã hóa chuẩn `.m4a` (`AAC-LC 192kbps, 48kHz`).
          files: build-output/S22U_CallRecorder.apk
          draft: false
          prerelease: false
