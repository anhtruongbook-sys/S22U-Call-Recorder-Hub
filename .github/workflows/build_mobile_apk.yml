name: Build S22 Ultra Call Recorder (APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart Environment
        run: |
          flutter --version
          dart --version

      - name: Install Flutter Dependencies
        working-directory: ./mobile_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./mobile_app
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare Single APK
        run: |
          mkdir -p build-output
          if [ -f mobile_app/build/app/outputs/flutter-apk/app-release.apk ]; then
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/S22U_CallRecorder.apk
          else
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/S22U_CallRecorder.apk
          fi

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: S22U_CallRecorder-mobile-release-apk
          path: build-output/S22U_CallRecorder.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.9.6
          name: "S22 Ultra Call Recorder Hub v2.9.6 (Fix Real Zalo Call 0.0 Mute & Low Volume + Prevent Auto Bridge Self-Disable + Pop-Immune Normalizer)"
          body: |
            ## Ứng Dụng Ghi Âm Cuộc Gọi Toàn Diện Cho Samsung Galaxy S22 Ultra (Non-Root - v2.9.6)
            - **Chống Tự Tắt Mất Quyền Cầu Nối `S22U Call Bridge` (`disableSelf()`)**: Khắc phục triệt để lỗi Cầu nối `OTTCallAccessibilityService` tự gọi `disableSelf()` do nhận diện nhầm từ khóa trên màn hình chính khi máy chưa cấp quyền `WRITE_SECURE_SETTINGS`, khiến các cuộc gọi Zalo/SIM thực tế bị Android 16 khóa tiếng về `0.0` trong khi bấm "Ghi Thử Ngay" vẫn có tiếng.
            - **Khuếch Đại Nhạy Cao Cho Cuộc Gọi Thực Tế (`MODE_IN_COMMUNICATION`) & Chống Xung Nổ Đầu File (`26.304`)**: Mở lại `AutomaticGainControl` phần cứng, hạ ngưỡng kích hoạt giọng nói cuộc gọi về `24..56` (nâng giọng nói cuộc gọi Zalo thực tế lên `8.8x..12.0x`), triệt tiêu xung nổ chuyển mạch phần cứng trong `210ms` đầu tiên và bỏ qua `0.45s` đầu / `0.25s` cuối khi chuẩn hóa `.m4a` (`22.500 / 32.767`).
          files: build-output/S22U_CallRecorder.apk
          draft: false
          prerelease: false
