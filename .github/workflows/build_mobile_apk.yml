name: Build S22 Ultra Call Recorder (APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart Environment
        run: |
          flutter --version
          dart --version

      - name: Install Flutter Dependencies
        working-directory: ./mobile_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./mobile_app
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare Single APK
        run: |
          mkdir -p build-output
          if [ -f mobile_app/build/app/outputs/flutter-apk/app-release.apk ]; then
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/S22U_CallRecorder.apk
          else
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/S22U_CallRecorder.apk
          fi

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: S22U_CallRecorder-mobile-release-apk
          path: build-output/S22U_CallRecorder.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.9.7
          name: "S22 Ultra Call Recorder Hub v2.9.7 (0ms Instant Banking Stealth + Zero-Overlay Idle + Smart Restore Guard)"
          body: |
            ## Ứng Dụng Ghi Âm Cuộc Gọi Toàn Diện Cho Samsung Galaxy S22 Ultra (Non-Root - v2.9.7)
            - **Tàng Hình Tức Thì `0ms` Khi Mở App Ngân Hàng / VNeID (100% Không Báo Lỗi)**: Khôi phục cơ chế tự động ngắt `OTTCallAccessibilityService` (`disableSelf()`) ngay lập tức (`0ms`) khi người dùng chạm vào biểu tượng App Ngân hàng từ màn hình chính hoặc khi cửa sổ App Ngân hàng vừa khởi chạy (kể cả khi chưa chạy lệnh Brevent), đồng thời **gỡ bỏ hoàn toàn lớp phủ `1x1` (`TYPE_ACCESSIBILITY_OVERLAY`)** khi không có cuộc gọi để tuyệt đối không bị SDK bảo mật ngân hàng phát hiện.
            - **Chặn Tự Bật Lại Nhầm Khi Đang Ở Trong App Ngân Hàng**: Sửa lỗi `bankingRestoreRunnable` tự động bật lại `OTTCallAccessibilityService` sau 15 giây khi người dùng vẫn đang thao tác bên trong App Ngân hàng (do `fgPkg == null`). Giờ đây hệ thống chỉ bật lại Cầu nối khi xác nhận chắc chắn người dùng đã thoát hẳn ra màn hình chính hoặc chuyển sang ứng dụng thông thường (`Zalo`, `Phone`, `Launcher`...).
            - **Giữ Nguyên Bộ Khuếch Đại Nhạy Cao Cho Cuộc Gọi Thực Tế (`v2.9.6`)**: Tự động gắn `1x1 Audio Anchor` đúng khoảnh khắc bắt đầu cuộc gọi Zalo/SIM, bật `AutomaticGainControl` phần cứng và khuếch đại giọng nói cuộc gọi `8.8x..12.0x`.
          files: build-output/S22U_CallRecorder.apk
          draft: false
          prerelease: false
